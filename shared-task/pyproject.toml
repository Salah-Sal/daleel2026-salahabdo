[project]
name = "daleel"
version = "0.1.0"
description = "Working code for the Daleel 2026 shared task: data handling, metrics, baselines, submission packaging."
requires-python = ">=3.11"
dependencies = [
    "dspy==3.3.0b1",
    "mlflow>=3.14.0",
    "optuna>=4.9.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
train = [
    "safetensors>=0.5,<1",
    "torch>=2.7,<3",
    "transformers>=4.50,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daleel"]
